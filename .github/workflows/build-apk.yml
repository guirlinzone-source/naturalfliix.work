name: Gerar APK

on:
  push:
    branches: [app-tabela-precos]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk TabelaPrecos.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tabela-precos-v1.0.${{ github.run_number }}
          name: Tabela de Preços v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: Baixe o arquivo TabelaPrecos.apk no celular e toque nele para instalar.
          files: TabelaPrecos.apk
